<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.65; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shieldPulse {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 24px rgba(168, 85, 247, 0.7)); }
    }
    @keyframes cardFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes cardFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    .orb-1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 200px 150px; }
    .orb-2 { animation: pulseOrb 8s ease-in-out infinite 2s; transform-origin: 1000px 250px; }
    .stream-line { stroke-dasharray: 8 12; animation: dataStream 4s linear infinite; }
    .stream-line-rev { stroke-dasharray: 6 10; animation: dataStream 3s linear infinite reverse; }
    .shield-icon { animation: shieldPulse 4s ease-in-out infinite; }
    .card-1 { animation: cardFloat1 5s ease-in-out infinite; }
    .card-2 { animation: cardFloat2 6s ease-in-out infinite 1s; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="orb-1" cx="200" cy="150" r="160" fill="#38bdf8" filter="url(#glow)" opacity="0.3" />
  <circle class="orb-2" cx="1020" cy="240" r="180" fill="#818cf8" filter="url(#glow)" opacity="0.25" />
  <circle cx="600" cy="380" r="140" fill="#a855f7" filter="url(#glow)" opacity="0.15" />

  <!-- Digital Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Connecting Network Data Streams (Subtle in background) -->
  <path class="stream-line" d="M 50 120 C 300 80, 450 200, 700 130 S 1050 90, 1150 150" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  <path class="stream-line-rev" d="M 80 320 C 350 370, 500 240, 800 310 S 1000 260, 1120 340" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.35" />

  <!-- Decorative Firewall Node Cards (Flanking) -->
  <!-- Left Node Card -->
  <g class="card-1" transform="translate(60, 260)">
    <rect width="210" height="95" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" filter="url(#cardGlow)" />
    <circle cx="28" cy="30" r="7" fill="#22c55e" />
    <circle cx="28" cy="30" r="11" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5" />
    <text x="46" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">nftables / XDP Engine</text>
    <text x="24" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Kernel Packet Inspection</text>
    <text x="24" y="78" fill="#38bdf8" font-family="monospace" font-size="10">STATUS: ENFORCING (DROP)</text>
  </g>

  <!-- Right Node Card -->
  <g class="card-2" transform="translate(930, 260)">
    <rect width="210" height="95" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5" filter="url(#cardGlow)" />
    <circle cx="28" cy="30" r="7" fill="#38bdf8" />
    <circle cx="28" cy="30" r="11" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <text x="46" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Per-App Egress Filtering</text>
    <text x="24" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Zero Trust Host Telemetry</text>
    <text x="24" y="78" fill="#a855f7" font-family="monospace" font-size="10">POLICY: ZERO TRUST (ALLOW)</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) -->
  <g transform="translate(600, 85)" text-anchor="middle">
    <!-- Center Shield Icon -->
    <g class="shield-icon" transform="translate(-32, -35) scale(1.35)">
      <path d="M24 4 C14 4 6 7 2 9 C2 21 8 36 24 44 C40 36 46 21 46 9 C42 7 34 4 24 4 Z" fill="url(#shieldGrad)" />
      <path d="M24 10 L38 14 C38 23 33 34 24 39 L24 10 Z" fill="#ffffff" opacity="0.25" />
      <path d="M20 23 L23 26 L29 19" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title -->
    <text y="70" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome-Endpoint-Host-Firewall-Protection
    </text>

    <!-- Subtitle -->
    <text y="105" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.2">
      Curated Host-Based Firewalls, Application Egress Filtering &amp; Endpoint Defense
    </text>

    <!-- Tagline description -->
    <text y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
      Enterprise SaaS Cloud Platforms vs. High-Performance Self-Hosted Open-Source Firewalls
    </text>

    <!-- Feature Pills in Center Foreground -->
    <g transform="translate(0, 168)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
        <text y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🛡️ Host-Based</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-85, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
        <text y="4" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🚦 Egress Control</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(85, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
        <text y="4" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">⚡ eBPF / nftables</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(250, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
        <text y="4" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🌐 Zero Trust</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#primaryGrad)" />
</svg>
